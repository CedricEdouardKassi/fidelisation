resources:
  jobs:
    fidelisation_job:
      name: "[${bundle.target}] Fidélisation - Job Orchestration"

      environments:
        - environment_key: "serverless_env"
          spec:
            client: "1"

      tasks:
        - task_key: "generate_data"
          notebook_task:
            notebook_path: ../../src/jobs/generate_data.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          environment_key: "serverless_env"

        - task_key: "run_pipeline"
          depends_on:
            - task_key: "generate_data"
          pipeline_task:
            pipeline_id: ${resources.pipelines.fidelisation_pipeline.id}
            full_refresh: false

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "Europe/Paris"

      permissions:
        - level: CAN_VIEW
          group_name: "users"

    test_scoring_job:
      name: "[${bundle.target}] Fidélisation - Tests"

      environments:
        - environment_key: "serverless_env"
          spec:
            client: "1"

      tasks:
        - task_key: "run_tests"
          notebook_task:
            notebook_path: ../../tests/test_scoring.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          environment_key: "serverless_env"

      permissions:
        - level: CAN_VIEW
          group_name: "users"
